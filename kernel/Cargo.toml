[package]
name = "jnox-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[features]
sched-bench = []
# FIFO and RR take precedence when combined with EDF.
edf-bench = ["sched-bench"]
fifo-bench = ["sched-bench"]
rr-bench = ["fifo-bench"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
