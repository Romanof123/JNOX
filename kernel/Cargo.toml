[package]
name = "jnox-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[features]
sched-bench = []
# Cooperative FCFS takes precedence over all other benches.
coop-bench = ["sched-bench"]
batch-bench = []
deadline-bench = []
aperiodic-bench = []
smp-bench = []
mutex-bench = []
# Live partition windows take precedence over CBS and older benches.
partition-bench = []
cbs-bench = []
periodic-bench = ["sched-bench"]
periodic-preempt-bench = ["periodic-bench"]
# FIFO and RR take precedence when combined with EDF.
edf-bench = ["sched-bench"]
fifo-bench = ["sched-bench"]
rr-bench = ["fifo-bench"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
