<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 792 518" width="792" height="518" role="img" aria-labelledby="title desc">
  <title id="title">J-NOX system architecture</title>
  <desc id="desc">Five layers from user applications through application interfaces, the privileged Rust microkernel, drivers and board support to hardware. Native Rust driver services and the Linux driver domain are isolated from the microkernel. Dashed component boxes mark planned paths.</desc>
  <style>
    text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; }
    .platform { font-size: 22px; font-weight: 700; fill: #153746; }
    .layer-label { font-size: 16px; font-weight: 700; }
    .name, .detail { text-anchor: middle; }
    .name { font-size: 15px; font-weight: 600; fill: #173541; }
    .detail { font-size: 13px; fill: #435d67; }
  </style>
  <rect x="1" y="1" width="790" height="516" rx="10" fill="#fafcfd" stroke="#476573" stroke-width="2"/>
  <text class="platform" x="24" y="37">J-NOX system architecture</text>
  <g class="layer" id="layer-1">
    <rect x="14" y="59" width="764" height="82" rx="7" fill="#eef3f5" stroke="#bdccd2"/>
    <text class="layer-label" x="28" y="83" fill="#193c4b">User applications</text>
    <g class="component">
      <rect x="26" y="92" width="242" height="39" rx="4" fill="#ffffff" stroke="#7495a1"/>
      <text class="name" x="147" y="119">Native Rust apps</text>
    </g>
    <g class="component">
      <rect x="275" y="92" width="242" height="39" rx="4" fill="#ffffff" stroke="#7495a1"/>
      <text class="name" x="396" y="119">Native C apps</text>
    </g>
    <g class="component">
      <rect x="524" y="92" width="242" height="39" rx="4" fill="#ffffff" stroke="#6a7b85" stroke-dasharray="5 3"/>
      <text class="name" x="645" y="119">Prebuilt Linux apps</text>
    </g>
  </g>
  <g class="layer" id="layer-2">
    <rect x="14" y="149" width="764" height="82" rx="7" fill="#eef3f5" stroke="#bdccd2"/>
    <text class="layer-label" x="28" y="173" fill="#193c4b">Application interfaces and system services</text>
    <g class="component">
      <rect x="26" y="182" width="242" height="39" rx="4" fill="#ffffff" stroke="#7495a1"/>
      <text class="name" x="147" y="200">Native user ABI</text>
      <text class="detail" x="147" y="215">J-NOX system calls</text>
    </g>
    <g class="component">
      <rect x="275" y="182" width="242" height="39" rx="4" fill="#ffffff" stroke="#6a7b85" stroke-dasharray="5 3"/>
      <text class="name" x="396" y="200">POSIX services</text>
      <text class="detail" x="396" y="215">Sockets and filesystems</text>
    </g>
    <g class="component">
      <rect x="524" y="182" width="242" height="39" rx="4" fill="#ffffff" stroke="#6a7b85" stroke-dasharray="5 3"/>
      <text class="name" x="645" y="200">Linux user ABI</text>
      <text class="detail" x="645" y="215">Linux ELF compatibility</text>
    </g>
  </g>
  <g class="layer" id="layer-3">
    <rect x="14" y="239" width="764" height="82" rx="7" fill="#163c50" stroke="#163c50"/>
    <text class="layer-label" x="28" y="263" fill="#ffffff">Rust microkernel · privileged EL1</text>
    <g class="component">
      <rect x="26" y="272" width="242" height="39" rx="4" fill="#e9f5f4" stroke="#b3d8d5"/>
      <text class="name" x="147" y="299">Threads and scheduling</text>
    </g>
    <g class="component">
      <rect x="275" y="272" width="242" height="39" rx="4" fill="#e9f5f4" stroke="#b3d8d5"/>
      <text class="name" x="396" y="299">IPC and endpoint rights</text>
    </g>
    <g class="component">
      <rect x="524" y="272" width="242" height="39" rx="4" fill="#e9f5f4" stroke="#b3d8d5"/>
      <text class="name" x="645" y="299">Address spaces</text>
    </g>
  </g>
  <g class="layer" id="layer-4">
    <rect x="14" y="329" width="764" height="82" rx="7" fill="#eef3f5" stroke="#bdccd2"/>
    <text class="layer-label" x="28" y="353" fill="#193c4b">Drivers and board support</text>
    <g class="component">
      <rect x="26" y="362" width="242" height="39" rx="4" fill="#ffffff" stroke="#6a7b85" stroke-dasharray="5 3"/>
      <text class="name" x="147" y="380">Native Rust drivers</text>
      <text class="detail" x="147" y="395">Isolated driver services</text>
    </g>
    <g class="component">
      <rect x="275" y="362" width="242" height="39" rx="4" fill="#ffffff" stroke="#6a7b85" stroke-dasharray="5 3"/>
      <text class="name" x="396" y="380">Linux driver domain</text>
      <text class="detail" x="396" y="395">Existing drivers via gateway</text>
    </g>
    <g class="component">
      <rect x="524" y="362" width="242" height="39" rx="4" fill="#ffffff" stroke="#7495a1"/>
      <text class="name" x="645" y="380">Board support (BSP)</text>
      <text class="detail" x="645" y="395">MMU, interrupts and timers</text>
    </g>
  </g>
  <g class="layer" id="layer-5">
    <rect x="14" y="419" width="764" height="82" rx="7" fill="#e5ecef" stroke="#bdccd2"/>
    <text class="layer-label" x="28" y="443" fill="#193c4b">Hardware and emulated hardware</text>
    <g class="component">
      <rect x="26" y="452" width="242" height="39" rx="4" fill="#ffffff" stroke="#7495a1"/>
      <text class="name" x="147" y="479">CPU cores</text>
    </g>
    <g class="component">
      <rect x="275" y="452" width="242" height="39" rx="4" fill="#ffffff" stroke="#7495a1"/>
      <text class="name" x="396" y="479">Memory</text>
    </g>
    <g class="component">
      <rect x="524" y="452" width="242" height="39" rx="4" fill="#ffffff" stroke="#7495a1"/>
      <text class="name" x="645" y="479">Peripherals and controllers</text>
    </g>
  </g>
</svg>
