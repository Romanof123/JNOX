[package]
name = "jnox-inet"
version = "0.1.0"
edition = "2021"

[dependencies]
jnox-native = { path = "../../sdk/native-aarch64/rust", features = ["sync-ipc"] }
smoltcp = { version = "=0.12.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
